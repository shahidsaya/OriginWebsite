<div class="w-full
{% if data.widget.gap === 'xs' %} h-2 sm:h-4{% endif %}
{% if data.widget.gap === 'sm' %} h-4 sm:h-6{% endif %}
{% if data.widget.gap === 'md' %} h-8 sm:h-12{% endif %}
{% if data.widget.gap === 'lg' %} h-16 sm:h-24{% endif %}
{% if apos.helpers.isDraftMode(data) %} flex items-center justify-center bg-extra-light-grey {% endif %}
">
    {% if apos.helpers.isDraftMode(data) %}
        <div class="apos-space-helper">
            <span>Horizontal Gap: {{ data.widget.gap }}</span>
        </div>
    {% endif %}
</div>
