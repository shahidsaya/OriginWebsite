{#<script>console.log('testimonial', {{ data.widget | dump | safe }})</script>#}

<script>
	function slider() {
		return {
			swiper: null,
			testimonials: [
				{% for testimonial in data.widget.testimonials %}
				{
					content: `{{ testimonial.testimonial }}`,
					name: "{{ testimonial.name }}",
					date: "{{ testimonial.date }}"
				},
				{% endfor %}
			],
			get testimonialCount() {
				return this.testimonials.length
			},
			activeIndex: 0,
			prev() {
				if (this.activeIndex > 0) {
					this.$refs.container.scroll({
						left: this.$refs.container.clientWidth * (this.activeIndex - 1),
						behavior: 'smooth'
					})
					this.activeIndex--;
				}
			},
			next() {
				if (this.activeIndex < this.testimonialCount - 1) {
					this.$refs.container.scroll({
						left: this.$refs.container.clientWidth * (this.activeIndex + 1),
						behavior: 'smooth'
					})
					this.activeIndex++;
				}
			},
			moveToIndex(newIndex) {
				this.activeIndex = newIndex

				this.$refs.container.scroll({
					left: this.$refs.container.clientWidth * this.activeIndex,
					behavior: 'smooth'
				})
			}
		}
	}


</script>

{% if apos.helpers.isDraftMode(data) %}
	<div class="h-16 apos-space-helper">
		<span>Testimonial</span>
	</div>
{% endif %}

<div x-data="slider()" x-init="swiper = new Swiper($refs.container, { loop: true,
	slidesPerView: 1,
	spaceBetween: 0,
	observer: true,
	observeParents: true,
	pagination: {
    el: '.swiper-pagination',
    type: 'bullets'
  }})" x-cloak>

	<div class="py-16 w-full bg-extra-light-grey">

		<div class="relative py-2 mx-auto max-w-md lg:max-w-3xl">

			{# <span x-text="'activeIndex: ' + activeIndex"></span>
			<br>
			<span x-text="'testimonialCount: ' + testimonialCount"></span> #}

			<div class="relative">

				<div class="hidden absolute left-0 top-1/2 pr-16 transform -translate-x-full -translate-y-1/2 sm:block">
					<button class="rounded-full bg-gold p-2.5" x-on:click="swiper.slidePrev()">
						<svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path d="M14.2502 9L3.75018 9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
							<path d="M9 14.25L3.75 8.99997L9 3.74997" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
						</svg>
					</button>
				</div>

				<div class="swiper-container" x-ref="container">
					<div class="swiper-wrapper">

						<template x-for="(testimonial, index) in testimonials" :key="index">
							<div class="text-center text-black swiper-slide">
								<p class="mb-4 text-3xl" x-text=`“${testimonial.content}”`></p>
								<p class="mt-3 text-xl font-bold" x-text="'- ' + testimonial.name"></p>
								<p class="text-lg" x-text="testimonial.date"></p>
							</div>
						</template>

					</div>
				</div>

				<div class="hidden absolute right-0 top-1/2 pl-16 transform translate-x-full -translate-y-1/2 sm:block">
					<button class="rounded-full bg-gold p-2.5" x-on:click="swiper.slideNext()" :disabled="activeIndex >= testimonialCount-1">
						<svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path d="M3.74985 9H14.2498" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
							<path d="M9 3.75003L14.25 9.00003L9 14.25" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
						</svg>
					</button>
				</div>
			</div>

			<div class="swiper-pagination"></div>

			<div class="flex justify-center items-center space-x-1.5 mt-6">
				<template x-for="(slide, index) in Array.from({ length: testimonials.length })" :key="index">

					<button class="w-2.5 h-2.5 text-white rounded-full hover:bg-light-grey"
							:class="activeIndex === index ? 'bg-gold' : 'bg-white'"
							x-on:click="moveToIndex(index)">
					</button>

				</template>
			</div>

		</div>

	</div>

</div>
